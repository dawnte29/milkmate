<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f14">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>밀크메이트</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --bg:#0b0f14; --sf:#141b24; --sf2:#1c2733; --sf3:#243141; --bd:#2b3745;
  --tx:#e9eff6; --mu:#93a5ba; --ac:#4da3ff;
  --ok:#2ecc8f; --wn:#f5b445; --dn:#ff6b6b;
  --r:14px; --tap:48px;
}
:root[data-theme="light"]{
  --bg:#eef1f6; --sf:#ffffff; --sf2:#f2f5fa; --sf3:#e4eaf2; --bd:#d5dde8;
  --tx:#0f1720; --mu:#5b6d84; --ac:#0b72e7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{margin:0;padding:0;height:100%}
/* body 에 height:100% 를 주면 sticky 헤더가 화면 한 개 높이까지만 붙어 있다가 밀려난다 */
body{margin:0;padding:0;min-height:100%}
body{
  background:var(--bg);color:var(--tx);
  font:400 17px/1.45 system-ui,-apple-system,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  overscroll-behavior-y:none;-webkit-text-size-adjust:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
input,select,textarea{
  background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:11px 12px;width:100%;outline:none;
}
input:focus,select,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;line-height:1.5}

/* ---------- layout ---------- */
#top{
  position:sticky;top:0;z-index:40;background:var(--bg);
  padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--bd);
}
#main{padding:12px 12px calc(96px + env(safe-area-inset-bottom));max-width:760px;margin:0 auto}
#tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:50;display:flex;
  background:var(--sf);border-top:1px solid var(--bd);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabs button{
  flex:1;padding:9px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:11.5px;color:var(--mu);
}
#tabs button .ic{font-size:20px;line-height:1}
#tabs button.on{color:var(--ac)}

/* ---------- header bits ---------- */
.hrow{display:flex;align-items:center;gap:8px}
.htitle{font-size:19px;font-weight:800;letter-spacing:-.3px}
.hsub{font-size:12.5px;color:var(--mu);margin-top:1px}
.datenav{display:flex;align-items:center;gap:6px;margin-left:auto;flex:none}
.datenav button{width:34px;height:34px;border-radius:9px;background:var(--sf2);border:1px solid var(--bd);font-size:15px;flex:none}
.datenav .today{width:auto;padding:0 11px;white-space:nowrap;font-size:13px;font-weight:700}
.dpill{min-height:36px;padding:0 13px;border-radius:99px;background:var(--sf2);border:1px solid var(--bd);
  font-size:13.5px;font-weight:700;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.dpill.on{background:var(--ac);border-color:var(--ac);color:#fff}
.bar{height:7px;background:var(--sf3);border-radius:99px;overflow:hidden;margin-top:9px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ok));border-radius:99px;transition:width .25s}

/* ---------- generic ---------- */
.card{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.pad{padding:14px}
.muted{color:var(--mu)}
.small{font-size:13px}
.tiny{font-size:11.5px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:8px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.right{margin-left:auto}
.sep{height:1px;background:var(--bd)}
.center{text-align:center}
.mt{margin-top:10px}.mt2{margin-top:18px}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:var(--tap);padding:0 16px;border-radius:12px;
  background:var(--sf2);border:1px solid var(--bd);font-weight:600;font-size:15px;
}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#04231a}
.btn.dn{color:var(--dn);border-color:#5c2b2b}
.btn.sm{min-height:38px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.xs{min-height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
.btn.full{width:100%}
.btn:active{transform:scale(.97)}
.pill{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:99px;background:var(--sf3);font-size:12px;font-weight:600}
.pill.ok{background:rgba(46,204,143,.16);color:var(--ok)}
.pill.wn{background:rgba(245,180,69,.16);color:var(--wn)}
.pill.dn{background:rgba(255,107,107,.16);color:var(--dn)}
.empty{padding:44px 20px;text-align:center;color:var(--mu);font-size:15px;line-height:1.7}

/* ---------- today: course ---------- */
.chead{
  display:flex;align-items:center;gap:8px;margin:20px 2px 9px;
}
.chead:first-child{margin-top:2px}
.chead .n{font-size:16px;font-weight:800;letter-spacing:-.2px}
.chead .c{font-size:12px;color:var(--mu);margin-left:auto}

/* ---------- today: line card ---------- */
.lc{background:var(--sf);border:1px solid var(--bd);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.lc.done{opacity:.5}
.lc.cur{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}
.lch{display:flex;align-items:center;gap:10px;padding:13px 14px;width:100%;text-align:left}
.lch .num{
  flex:none;width:28px;height:28px;border-radius:8px;background:var(--sf3);
  display:grid;place-items:center;font-size:12.5px;font-weight:800;color:var(--mu)
}
.lc.cur .lch .num{background:var(--ac);color:#fff}
.lch .t{display:block;font-size:17px;font-weight:800;letter-spacing:-.3px}
.lch .s{display:block;font-size:12px;color:var(--mu);margin-top:2px}
.lch .cnt{margin-left:auto;font-size:12.5px;color:var(--mu);font-weight:700;flex:none}
.code{
  display:flex;align-items:center;gap:10px;margin:0 14px 12px;padding:11px 13px;
  background:var(--sf2);border:1px dashed var(--bd);border-radius:11px;width:calc(100% - 28px);text-align:left;
}
.code .k{font-size:12px;color:var(--mu);flex:none}
.code .v{
  font:800 26px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:3px;color:var(--wn);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis
}
.code .z{font-size:11px;color:var(--mu);flex:none}

/* ---------- unit rows ---------- */
.u{display:flex;align-items:flex-start;gap:10px;padding:11px 14px;border-top:1px solid var(--bd)}
.u.skip{opacity:.42}
.u.on{background:rgba(46,204,143,.07)}
.uck{
  flex:none;width:34px;height:34px;border-radius:9px;border:2px solid var(--bd);
  display:grid;place-items:center;font-size:17px;color:transparent;background:var(--sf2);margin-top:1px;
}
.u.on .uck{background:var(--ok);border-color:var(--ok);color:#04231a}
.uno{font-size:19px;font-weight:800;letter-spacing:-.4px;flex:none;min-width:62px}
.u.on .uno,.u.skip .uno{text-decoration:line-through;text-decoration-thickness:2px}
.items{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.it{
  display:inline-flex;align-items:center;gap:0;border-radius:9px;overflow:hidden;
  border:1px solid var(--bd);background:var(--sf2);
}
.it .nm{padding:5px 8px;font-size:14px;font-weight:600;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.it .q{padding:5px 9px;font-size:15px;font-weight:800;background:var(--sf3);min-width:30px;text-align:center}
.it.adj .q{background:var(--wn);color:#2a1c00}
.it .dot{width:9px;align-self:stretch;flex:none}
.uwho{font-size:13.5px;color:var(--mu);font-weight:600;flex:none}
.ucode{
  display:inline-flex;align-items:center;gap:7px;margin-top:6px;padding:5px 11px;
  background:rgba(245,180,69,.13);border:1px solid rgba(245,180,69,.32);border-radius:9px;
  font:800 17px/1.1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  letter-spacing:1.5px;color:var(--wn);
}
.umemo{font-size:12.5px;color:var(--wn);margin-top:5px;opacity:.85}
.uact{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}

/* ---------- manage ---------- */
.li{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:1px solid var(--bd);width:100%;text-align:left}
.li:first-child{border-top:0}
.li .t{font-size:16px;font-weight:700}
.li .s{font-size:12px;color:var(--mu);margin-top:2px}
/* 목록 요약 줄은 길어도 한 줄 유지 (자세한 건 눌러서 확인) */
.li .t,.li .s,.li .tiny{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lch .t,.lch .s,.chead .n{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ord{display:flex;flex-direction:column;gap:3px;flex:none}
.ord button{width:32px;height:22px;border-radius:6px;background:var(--sf3);font-size:11px;display:grid;place-items:center}
.crumb{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--mu);margin-bottom:12px}
.crumb b{color:var(--tx)}

/* ---------- products ---------- */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.pc{background:var(--sf);border:1px solid var(--bd);border-radius:12px;overflow:hidden;text-align:left}
.pc .im{aspect-ratio:1;background:var(--sf3);display:grid;place-items:center;overflow:hidden}
.pc .im img{width:100%;height:100%;object-fit:cover;display:block}
.pc .im .ph{font-size:30px;opacity:.35}
.pc .nm{display:block;padding:8px 9px;font-size:13.5px;font-weight:700;line-height:1.3}
.pc .nm .mk{display:block;font-size:11px;font-weight:600;color:var(--mu);margin-top:3px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- modal ---------- */
.ov{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.65);backdrop-filter:blur(3px);display:flex;flex-direction:column;justify-content:flex-end}
.sheet{
  background:var(--sf);border-radius:20px 20px 0 0;max-height:92vh;overflow:auto;
  padding:8px 16px calc(20px + env(safe-area-inset-bottom));
  animation:up .18s ease-out;max-width:760px;width:100%;margin:0 auto;
}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:38px;height:4px;background:var(--bd);border-radius:99px;margin:6px auto 12px}
.sh{font-size:18px;font-weight:800;margin:0 0 14px}
.lb{font-size:12.5px;color:var(--mu);font-weight:700;margin:14px 0 6px}
.lb:first-of-type{margin-top:4px}
.pv{position:fixed;inset:0;z-index:110;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px}
.pv img{max-width:100%;max-height:72vh;border-radius:14px;object-fit:contain}
.pv .cap{font-size:22px;font-weight:800;color:#fff;text-align:center}
.bigcode{position:fixed;inset:0;z-index:110;background:#000;display:grid;place-items:center;padding:20px;text-align:center}
.bigcode .v{font:900 clamp(46px,17vw,110px)/1.1 ui-monospace,Consolas,monospace;letter-spacing:6px;color:#ffd479;word-break:break-all}
.bigcode .k{color:#8fa1b6;font-size:16px;margin-bottom:14px}

/* ---------- misc ---------- */
.dchk{display:flex;gap:6px;flex-wrap:wrap}
.dchk button{width:42px;height:42px;border-radius:11px;background:var(--sf2);border:1px solid var(--bd);font-weight:700;font-size:15px}
.dchk button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.adjit{border:1px solid var(--bd);border-radius:12px;padding:10px 12px;margin-top:10px;background:var(--sf2)}
.irow{border:1px solid var(--bd);border-radius:12px;padding:9px 10px;margin-top:9px;background:var(--sf2)}
.stp{display:flex;align-items:center;gap:0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;flex:none}
.stp button{width:40px;height:40px;background:var(--sf2);font-size:19px;font-weight:700;display:grid;place-items:center}
.stp .v{min-width:38px;text-align:center;font-weight:800;font-size:16px}
.sumrow{display:flex;align-items:center;gap:11px;padding:11px 14px;border-top:1px solid var(--bd)}
.sumrow:first-child{border-top:0}
.sumrow .th{width:46px;height:46px;border-radius:10px;background:var(--sf3);flex:none;display:grid;place-items:center;overflow:hidden}
.sumrow .th img{width:100%;height:100%;object-fit:cover}
.sumrow .q{margin-left:auto;font-size:23px;font-weight:900;letter-spacing:-.5px;flex:none;white-space:nowrap}
.sumrow .q .of{font-size:14px;font-weight:700;color:var(--mu)}
.sumrow .q .strike{text-decoration:line-through;text-decoration-thickness:3px}
.sumrow .q .ck{color:var(--ok);font-size:18px;margin-left:5px}
.sumrow.fin{opacity:.45}
.sumrow.fin .b{text-decoration:line-through;text-decoration-thickness:2px}
.fab{
  position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:45;
  height:46px;padding:0 18px;border-radius:99px;background:var(--ac);color:#fff;font-weight:800;font-size:14.5px;
  box-shadow:0 6px 22px rgba(0,0,0,.45);display:inline-flex;align-items:center;gap:7px;
}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom));
  z-index:200;background:#000d;color:#fff;padding:11px 18px;border-radius:99px;font-size:14px;font-weight:600;
  border:1px solid #ffffff22;
  /* 알약 모양이 깨지지 않게 항상 한 줄 */
  white-space:nowrap;text-align:center;
  max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis;
}
code.k{background:var(--sf3);padding:1px 6px;border-radius:5px;font-size:13px}
/* 붙여넣기 형식 예시 — 폰에서 줄이 접혀 어긋나지 않게 가로 스크롤 + 색으로 구분.
   타이핑하는 동안에도 계속 보이도록 입력칸 위에 붙여 둔다 */
.exwrap{position:sticky;top:0;z-index:3;background:var(--sf);padding:10px 0 9px}
.exline{
  background:var(--sf2);border:1px solid var(--bd);border-radius:10px;
  padding:10px 11px;font:600 13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  /* 글자를 줄이는 대신 줄바꿈시킨다 — 색으로 구분하니 줄이 바뀌어도 헷갈리지 않음 */
  white-space:normal;word-break:keep-all;overflow-wrap:anywhere;
}
.exline b{white-space:nowrap}
.ex-k{color:var(--wn)}
.ex-m{color:var(--ok)}
</style>
</head>
<body>

<header id="top"></header>
<main id="main"></main>
<nav id="tabs">
  <button data-act="tab" data-v="today" class="on"><span class="ic">🚚</span>오늘 배달</button>
  <button data-act="tab" data-v="load"><span class="ic">📦</span>적재 수량</button>
  <button data-act="tab" data-v="manage"><span class="ic">🏢</span>명단 관리</button>
  <button data-act="tab" data-v="prod"><span class="ic">🥛</span>우유 품목</button>
  <button data-act="tab" data-v="set"><span class="ic">⚙️</span>설정</button>
</nav>
<div id="modal"></div>

<script>
"use strict";
/* =========================================================
   우유 배달 동선 앱 — 데이터
   구조: 코스(동네) > 동 > 라인(공동현관 단위) > 세대(호수)
   ========================================================= */
const KEY='milk_v1';
const VER='v37 · 2026-08-22';        // 설정 맨 아래에 표시. 폰이 새 버전인지 확인용
const DOW=['일','월','화','수','목','금','토'];
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);

function blank(){
  return {v:1,
    courses:[],blocks:[],lines:[],units:[],products:[],
    daily:{},
    order:{},
    set:{theme:'dark',days:[1,3,5],floorDesc:true,seen:false}
  };
}
let S=blank();
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.v){S=Object.assign(blank(),r);S.set=Object.assign(blank().set,r.set||{});
  /* 예전 버전의 품목 '메모' 를 '제조사' 로 옮긴다 */
  S.products.forEach(p=>{if(p.maker==null&&p.memo!=null){p.maker=p.memo;delete p.memo}});}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('저장 공간이 부족해요')}};

/* ---------- 사진 저장 ----------
   1순위 IndexedDB, 막히면 localStorage 로 자동 전환.
   저장 형식은 data URL 문자열 — blob: 주소가 막히는 환경에서도 화면에 뜬다.
   IndexedDB 가 응답 없이 멈추는 경우가 있어 4초 제한을 둔다. */
const PIC={};                       // productId -> data URL
const LSPIC='milk_pic_';
let _db=null,_idbBad='',PICSTORE='?';
function idb(){
  if(_db)return Promise.resolve(_db);
  if(_idbBad)return Promise.reject(new Error(_idbBad));
  return new Promise((res,rej)=>{
    let done=false;
    const fail=m=>{if(done)return;done=true;_idbBad=m;rej(new Error(m))};
    let r;
    try{r=indexedDB.open('milkphoto',1)}catch(e){return fail('IndexedDB 차단됨')}
    if(!r)return fail('IndexedDB 없음');
    setTimeout(()=>fail('IndexedDB 응답 없음'),4000);
    r.onupgradeneeded=()=>{try{const d=r.result;if(!d.objectStoreNames.contains('p'))d.createObjectStore('p')}catch(e){}};
    r.onsuccess=()=>{if(!done){done=true;_db=r.result;res(_db)}};
    r.onerror=()=>fail('IndexedDB 열기 실패');
    r.onblocked=()=>fail('IndexedDB 잠김');
  });
}
const asDataURL=v=>typeof v==='string'?Promise.resolve(v):blob2b64(v);

async function photoPut(id,blob){
  const d=await asDataURL(blob);
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const t=db.transaction('p','readwrite');t.objectStore('p').put(d,id);
      t.oncomplete=res;t.onerror=()=>rej(t.error||new Error('쓰기 실패'));t.onabort=()=>rej(t.error||new Error('쓰기 중단'));
    });
    try{localStorage.removeItem(LSPIC+id)}catch(e){}
    PICSTORE='IndexedDB';
  }catch(e){
    localStorage.setItem(LSPIC+id,d);          // 용량이 넘치면 예외가 그대로 올라감
    PICSTORE='localStorage';
  }
  PIC[id]=d;
  return d;
}
async function photoDel(id){
  try{const db=await idb();await new Promise(res=>{const t=db.transaction('p','readwrite');t.objectStore('p').delete(id);t.oncomplete=res;t.onerror=res})}catch(e){}
  try{localStorage.removeItem(LSPIC+id)}catch(e){}
  delete PIC[id];
}
async function photoAll(){
  const out={};
  try{
    const db=await idb();
    const got=await new Promise(res=>{
      const t=db.transaction('p','readonly'),o=t.objectStore('p'),m={};
      const kq=o.getAllKeys(),vq=o.getAll();
      t.oncomplete=()=>{(kq.result||[]).forEach((k,i)=>m[k]=vq.result[i]);res(m)};
      t.onerror=()=>res(m);
      t.onabort=()=>res(m);
      setTimeout(()=>res(m),5000);                 // 응답이 없어도 앱이 멈추지 않게
    });
    for(const k in got)out[k]=got[k];
    if(Object.keys(got).length)PICSTORE='IndexedDB';
  }catch(e){}
  try{
    for(let i=0;i<localStorage.length;i++){
      const k=localStorage.key(i);
      if(k&&k.indexOf(LSPIC)===0){
        const id=k.slice(LSPIC.length);
        if(!out[id]){out[id]=localStorage.getItem(k);PICSTORE='localStorage'}
      }
    }
  }catch(e){}
  return out;
}
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('시간 초과')),ms))]);
async function loadPics(){
  for(const k in PIC)delete PIC[k];
  let all={};
  try{all=await withTimeout(photoAll(),8000)}catch(e){return}
  /* 사진 한 장이 말썽이어도 나머지는 계속 불러온다 */
  for(const k in all){try{PIC[k]=await withTimeout(asDataURL(all[k]),4000)}catch(e){}}
}
/* 폰 사진(4000x3000 등)을 작게 줄여서 blob 으로.
   예전엔 readAsDataURL 로 통째로 문자열을 만들었는데 폰에서 메모리가 터져 실패했음.
   createImageBitmap → objectURL 순으로 시도해서 큰 사진도 견디게 함. */
async function fileToBlob(file,max=1000,q=.82){
  let src=null,bmp=null,url=null;
  try{
    if(window.createImageBitmap){
      try{bmp=await createImageBitmap(file);src=bmp}catch(e){}
    }
    if(!src){
      url=URL.createObjectURL(file);
      src=await new Promise((res,rej)=>{
        const i=new Image();
        i.onload=()=>res(i);
        i.onerror=()=>rej(new Error('이 형식의 사진은 못 읽어요'));
        i.src=url;
      });
    }
    const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight;
    if(!w||!h)throw new Error('사진 크기를 알 수 없어요');
    const sc=Math.min(1,max/Math.max(w,h));
    const cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
    const c=document.createElement('canvas');c.width=cw;c.height=ch;
    const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,cw,ch);x.drawImage(src,0,0,cw,ch);
    const out=await new Promise(r=>c.toBlob(r,'image/jpeg',q));
    if(!out)throw new Error('사진을 줄이지 못했어요');
    return out;
  }finally{
    if(bmp&&bmp.close)bmp.close();
    if(url)URL.revokeObjectURL(url);
  }
}
/* 사진 저장 — 줄이기에 실패하면 원본이라도 저장한다. 성공하면 '' , 실패하면 사유를 돌려줌 */
async function savePhoto(id,file){
  let blob=null;
  try{blob=await fileToBlob(file)}
  catch(err){
    if(/^image\/(jpeg|png|webp|gif)$/i.test(file.type||'')&&file.size<=5*1024*1024)blob=file;   // 원본 그대로
    else return (err&&err.message)||'사진을 읽지 못했어요';
  }
  try{await photoPut(id,blob);await loadPics();return ''}
  catch(err){return '저장 공간에 못 넣었어요'}
}

/* =========================================================
   조회 헬퍼
   ========================================================= */
/* 배달 순서는 요일마다 따로 저장한다.
   S.order = { 1:{id:순번,…}, 3:{…}, 5:{…} }  — 그 요일에 저장된 게 없으면 기본 sort 를 씀.
   OW = 지금 어떤 요일 기준으로 정렬할지 (null 이면 기본 순서) */
let OW=null;
const ordOf=x=>{
  const m=(OW!=null&&S.order)?S.order[OW]:null;
  return (m&&m[x.id]!=null)?m[x.id]:(x.sort??0);
};
const byS=(a,b)=>ordOf(a)-ordOf(b);
/* 이 요일에 배달하는 세대만 걸러내기 (명단 관리 요일 필터) */
const mFilter=us=>MST.day==null?us:us.filter(u=>onDay(u,MST.day));
/* 여러 요일 순서에서 특정 세대·라인들을 지워 기본 순서를 따르게 함 */
function clearOrder(ids){
  if(!S.order)return;
  for(const w in S.order)ids.forEach(id=>delete S.order[w][id]);
}
const courses=()=>S.courses.slice().sort(byS);
const blocksOf=c=>S.blocks.filter(b=>b.cid===c).sort(byS);
const linesOf=b=>S.lines.filter(l=>l.bid===b).sort(byS);
const unitsOf=l=>S.units.filter(u=>u.lid===l).sort(byS);
const P=id=>S.products.find(p=>p.id===id);
const pname=id=>{const p=P(id);return p?p.name:'?'};
const F=(id,arr)=>arr.find(x=>x.id===id);

function dkey(d){const p=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())}
function parseD(s){const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
let DATE=dkey(new Date());
function day(k=DATE){
  if(!S.daily[k])S.daily[k]={done:{},skip:{},adj:{},extra:[]};
  const d=S.daily[k];d.done=d.done||{};d.skip=d.skip||{};d.adj=d.adj||{};d.extra=d.extra||[];
  return d;
}
const dow=()=>parseD(DATE).getDay();

/* 오늘 이 세대가 배달 대상인가 */
function onDay(u,w=dow()){const ds=u.days&&u.days.length?u.days:S.set.days;return ds.includes(w)}

/* 이 품목의 오늘 수량 — dq(요일별 수량)가 있으면 그걸 씀 */
const qtyOf=(i,w)=>(i.dq&&i.dq[w]!=null)?i.dq[w]:(i.qty||0);
/* 오늘 실제 수량 (고정 + 당일 조정) */
function eff(u,d=day(),w=dow()){
  const m=new Map();
  (u.items||[]).forEach(i=>{
    if(i.d&&i.d.length&&!i.d.includes(w))return;   // 이 품목만 다른 요일이면 건너뜀
    m.set(i.pid,(m.get(i.pid)||0)+qtyOf(i,w));
  });
  const a=d.adj[u.id]||{};
  for(const pid in a)m.set(pid,(m.get(pid)||0)+a[pid]);
  return [...m].filter(([,q])=>q>0).map(([pid,qty])=>({pid,qty,adj:!!(a[pid])}));
}

/* 오늘의 전체 배달 트리 */
function plan(){
  const d=day(),w=dow(),out=[];
  OW=w;                       // 오늘 요일의 순서로 정렬
  for(const c of courses()){
    const cl=[];
    for(const b of blocksOf(c.id))for(const l of linesOf(b.id)){
      let us=unitsOf(l.id).filter(u=>onDay(u,w));
      const ex=d.extra.filter(e=>e.lid===l.id).map(e=>({...e,temp:true}));
      us=us.concat(ex);
      if(!us.length)continue;
      const live=us.filter(u=>!d.skip[u.id]);
      cl.push({line:l,block:b,units:us,total:live.length,done:live.filter(u=>d.done[u.id]).length});
    }
    if(cl.length)out.push({course:c,lines:cl});
  }
  return out;
}
function stats(pl){
  let t=0,dn=0;pl.forEach(c=>c.lines.forEach(l=>{t+=l.total;dn+=l.done}));return{t,dn};
}

function topBase(title,sub,extra=''){
  return `<div class="hrow"><div class="grow"><div class="htitle">${title}</div>${sub?`<div class="hsub">${sub}</div>`:''}</div>${extra}</div>`;

/* ================= 오늘 배달 ================= */
function vToday(){
  const pl=plan(),st=stats(pl),d=day();
  const dt=parseD(DATE),isT=DATE===dkey(new Date());
  const pct=st.t?Math.round(st.dn/st.t*100):0;
  const top=topBase(
    `${dt.getMonth()+1}월 ${dt.getDate()}일 (${DOW[dt.getDay()]})`,
    st.t?`${st.dn} / ${st.t} 세대 · ${pct}% 완료`:'오늘 배달할 세대가 없어요',
    `<div class="datenav">
       <button data-act="dmove" data-n="-1">‹</button>
       ${isT?'':'<button data-act="dtoday" class="today" style="color:var(--wn)">오늘</button>'}
       <button data-act="dmove" data-n="1">›</button>
     </div>`)
    +`<div class="bar"><i style="width:${pct}%"></i></div>`;

  if(!S.courses.length) return {top,body:onboard()};
  if(!pl.length) return {top,body:`<div class="card"><div class="empty">${DOW[dt.getDay()]}요일에 배달할 세대가 없어요.<br><span class="small">기본 배달 요일은 <b>설정</b>에서 바꿀 수 있어요.</span></div></div>`};

  let firstOpen=true,idx=0,body='';
  const OPEN=window.__open||(window.__open=new Set());
  for(const c of pl){
    const ct=c.lines.reduce((a,l)=>a+l.total,0),cd=c.lines.reduce((a,l)=>a+l.done,0);
    body+=`<div class="chead"><span class="n">📍 ${esc(c.course.name)}</span><span class="c">${cd}/${ct} 세대</span></div>`;
    for(const L of c.lines){
      idx++;
      const fin=L.total>0&&L.done>=L.total;
      const cur=!fin&&firstOpen;if(cur)firstOpen=false;
      const open=!fin||OPEN.has(L.line.id);
      body+=`<div class="lc ${fin?'done':''} ${cur?'cur':''}" id="L${L.line.id}">
        <button class="lch" data-act="ltog" data-id="${L.line.id}">
          <span class="num">${idx}</span>
          <span class="grow"><span class="t">${esc(L.block.name)} ${esc(L.line.name)}</span>
          ${L.line.memo?`<span class="s">📝 ${esc(L.line.memo)}</span>`:''}</span>
          <span class="cnt">${fin?'<span class="pill ok">완료 '+(open?'▲':'▼')+'</span>':L.done+'/'+L.total}</span>
        </button>`;
      if(open){
        if(L.line.code)body+=`<button class="code" data-act="bigcode" data-id="${L.line.id}">
          <span class="k">공동현관</span><span class="v">${esc(L.line.code)}</span><span class="z">탭 → 확대</span></button>`;
        for(const u of L.units)body+=uRow(u,d,L.line.id);
        /* 한 라인에 배달할 집이 2곳 이상일 때만 일괄 완료 버튼을 보여준다 */
        if(L.total>L.done)body+=`<div class="pad" style="border-top:1px solid var(--bd);display:flex;gap:8px">
          ${L.total>1?`<button class="btn ok grow" data-act="ldone" data-id="${L.line.id}">라인 배달 완료</button>`:''}
          <button class="btn sm ${L.total>1?'':'grow'}" data-act="uadd" data-lid="${L.line.id}">＋오늘만 추가</button></div>`;
      }
      body+='</div>';
    }
  }
  return {top,body,fab:st.dn<st.t?{h:'📍 배달할 곳',a:'next'}:null};
}

function uRow(u,d,lid){
  const on=!!d.done[u.id],sk=!!d.skip[u.id];
  const its=eff(u,d);
  return `<div class="u ${on?'on':''} ${sk?'skip':''}">
    <button class="uck" data-act="utog" data-id="${u.id}" ${sk?'disabled':''}>✓</button>
    <div class="grow">
      <div class="row wrap">
        <span class="uno">${esc(u.name)}</span>
        ${u.who?`<span class="uwho">${esc(u.who)}</span>`:''}

        ${sk?'<span class="pill dn">오늘 쉼</span>':''}
        <button class="btn xs right" data-act="uedit" data-id="${u.id}" data-lid="${lid}">조정</button>

      ${u.code?`<button class="ucode" data-act="bigcode" data-t="u" data-id="${u.id}">🔑 ${esc(u.code)}</button>`:''}
      ${its.length?`<div class="items">${its.map(i=>{const p=P(i.pid);return `<button class="it ${i.adj?'adj':''}" data-act="pic" data-id="${i.pid}">

      ${u.memo?`<div class="umemo">⚠ ${esc(u.memo)}</div>`:''}

}

/* ================= 적재 수량 ================= */
function vLoad(){
  const pl=plan(),d=day(),dt=parseD(DATE);
  /* 품목별로 [전체수량, 배달완료수량] 을 모은다 */
  const tot=new Map(),per=[];
  const add=(m,pid,q,fin)=>{const a=m.get(pid)||[0,0];a[0]+=q;if(fin)a[1]+=q;m.set(pid,a)};
  for(const c of pl){
    const m=new Map();
    for(const L of c.lines)for(const u of L.units){
      if(d.skip[u.id])continue;
      const fin=!!d.done[u.id];
      for(const i of eff(u,d)){add(m,i.pid,i.qty,fin);add(tot,i.pid,i.qty,fin)}
    }
    if(m.size)per.push({name:c.course.name,m});
  }
  const sum=m=>[...m.values()].reduce((a,b)=>[a[0]+b[0],a[1]+b[1]],[0,0]);
  const [grand,gdone]=sum(tot);
  const top=topBase('적재 수량',
    `${dt.getMonth()+1}/${dt.getDate()} (${DOW[dt.getDay()]}) · 총 ${grand}개`+(gdone?` · <b style="color:var(--ac)">남은 ${grand-gdone}개</b>`:''));
  if(!tot.size)return{top,body:`<div class="card"><div class="empty">오늘 실을 물건이 없어요.</div></div>`};

  /* 다 배달한 품목은 취소선 + 아래로 내리고, 일부만 했으면 남은 개수를 크게 */
  const rows=m=>[...m]
    .sort((a,b)=>{
      const fa=a[1][0]-a[1][1]<=0?1:0, fb=b[1][0]-b[1][1]<=0?1:0;
      return fa-fb || b[1][0]-a[1][0];
    })
    .map(([pid,[q,dn]])=>{
      const p=P(pid),rem=q-dn,fin=rem<=0;
      const qty=fin?`<span class="strike">${q}</span><span class="ck">✓</span>`
              :dn?`${rem}<span class="of">/${q}</span>`
              :`${q}`;
      return `<button class="sumrow ${fin?'fin':''}" style="width:100%;text-align:left" data-act="pic" data-id="${pid}">
        <span class="th">${PIC[pid]?`<img src="${PIC[pid]}" alt="">`:'<span style="opacity:.4">🥛</span>'}</span>
        <span class="grow"><span class="b">${esc(pname(pid))}</span>
        ${p&&p.maker?`<div class="tiny muted">${esc(p.maker)}</div>`:''}</span>
        <span class="q">${qty}</span></button>`;
    }).join('');

  let body=`<div class="card"><div class="pad row" style="padding-bottom:4px"><span class="b">전체 합계</span>
    <span class="right pill ${gdone>=grand?'ok':''}">${gdone?(grand-gdone)+' / ':''}${grand}개</span></div>${rows(tot)}</div>`;
  if(per.length>1)per.forEach(c=>{
    const [s,sd]=sum(c.m);
    body+=`<div class="chead"><span class="n">📍 ${esc(c.name)}</span>
      <span class="c">${sd?`남은 ${s-sd} / `:''}${s}개</span></div><div class="card">${rows(c.m)}</div>`;
  });
  body+=`<p class="tiny muted center mt2">품목을 누르면 사진이 나와요${gdone?' · 다 배달한 품목은 아래로 내려갑니다':''}</p>`;
  return{top,body};
}

      const nl=linesOf(x.id).length,nu=linesOf(x.id).reduce((s,ll)=>s+mf(unitsOf(ll.id)).length,0);

        <button class="grow" style="text-align:left" data-act="mgo" data-c="${c.id}" data-b="${x.id}"><div class="t">🏢 ${esc(x.name)}</div><div class="s">라인 ${nl}개 · 세대 ${nu}곳</div></button>
        <button class="btn xs" data-act="bed" data-id="${x.id}">수정</button></div>`}).join('')}</div>`
      :`<div class="card"><div class="empty">아파트 동을 추가해요.<br><span class="small">예: 101동, 102동</span></div></div>`);
    body+=`<button class="btn pri full" data-act="bed">＋ 동 추가</button>`;
  } else if(!MST.lid){
    const ls=visLines(b.id);
    body+=hiddenNote(linesOf(b.id),ls)+(ls.length?`<div class="card">${ls.map((x,i)=>{
      const nu=mf(unitsOf(x.id)).length;
      return `<div class="li"><div class="ord">${ordBtns('l',x.id,i,ls.length)}</div>
        <button class="grow" style="text-align:left" data-act="mgo" data-c="${c.id}" data-b="${b.id}" data-l="${x.id}">

          <div class="s">${x.code?`🔑 ${esc(x.code)} · `:''}세대 ${nu}곳</div></button>
        <button class="btn xs" data-act="led" data-id="${x.id}">수정</button></div>`}).join('')}</div>`
      :`<div class="card"><div class="empty">라인을 추가해요.<br><span class="small">예: 1-2라인, 3-4라인<br>공동현관 비밀번호는 라인마다 따로 저장돼요</span></div></div>`);
    body+=`<button class="btn pri full" data-act="led">＋ 라인 추가</button>`;
  } else {
    const us=mf(unitsOf(l.id));
    body+=`<div class="card pad">
      <div class="row"><span class="b">🔑 공동현관</span>

      <button class="btn sm full mt" data-act="led" data-id="${l.id}">라인 정보 수정</button></div>`;
    body+=us.length?`<div class="card">${us.map((x,i)=>`<div class="li"><div class="ord">${ordBtns('u',x.id,i,us.length)}</div>
      <button class="grow" style="text-align:left" data-act="ued" data-id="${x.id}">
        <div class="t">${esc(x.name)}${x.who?` <span class="muted" style="font-weight:400;font-size:13px">${esc(x.who)}</span>`:''}</div>

      </button></div>`).join('')}</div>`

      <button class="btn" data-act="autosort" data-l="${l.id}">층순 정렬</button></div>`;

/* 품목 한 줄 표시.
   요일을 골랐으면 그 요일 수량만 (다른 요일 숫자를 같이 보여주면 헷갈림).
   '전체' 일 때만 기본 수량 + 따로 정해둔 요일을 파랗게 덧붙인다. */
function itLabel(it){
  const nm=esc(pname(it.pid));
  if(MST.day!=null)return nm+' '+qtyOf(it,MST.day);
  const dq=it.dq?Object.keys(it.dq).sort().map(k=>DOW[k]+it.dq[k]).join(' '):'';
  const d=it.d&&it.d.length?' ['+it.d.map(x=>DOW[x]).join('')+']':'';
  return nm+' '+(it.qty||0)+(dq?` <span style="color:var(--ac)">${dq}</span>`:'')+d;
}
/* 삭제 버튼 글자 — 요일을 골라놨으면 그 요일에서만 빼는 것임을 분명히.
   안이 텅 비어 있으면 어느 요일에도 영향이 없으니 그냥 삭제 */
function delLabel(t,id){
  if(t&&t!=='u'&&!unitsUnder(t,id).length)return '🗑 빈 '+({c:'코스',b:'동',l:'라인'}[t])+' 삭제';
  return MST.day==null?'🗑 완전히 삭제 (모든 요일)':`🚫 ${DOW[MST.day]}요일 배달에서 빼기`;
}
/* 요일을 골랐으면 그날 배달이 없는 코스·동·라인은 목록에서 숨긴다 */
const shown=(t,id)=>MST.day==null||unitsUnder(t,id).some(u=>onDay(u,MST.day));
const visCourses=()=>courses().filter(x=>shown('c',x.id));
const visBlocks=cid=>blocksOf(cid).filter(x=>shown('b',x.id));
const visLines=bid=>linesOf(bid).filter(x=>shown('l',x.id));
const hiddenNote=(all,vis)=>all.length>vis.length
  ?`<p class="tiny muted" style="margin:-4px 0 10px">${DOW[MST.day]}요일에 배달이 없는 ${all.length-vis.length}개는 숨겼어요. <b>전체</b>를 누르면 다 보여요.</p>`:'';
/* 코스/동/라인/세대 아래에 딸린 세대들 */
function unitsUnder(t,id){
  if(t==='u'){const u=F(id,S.units);return u?[u]:[]}
  let lids;
  if(t==='l')lids=[id];
  else if(t==='b')lids=S.lines.filter(l=>l.bid===id).map(l=>l.id);
  else{const bs=S.blocks.filter(b=>b.cid===id).map(b=>b.id);lids=S.lines.filter(l=>bs.includes(l.bid)).map(l=>l.id)}
  return S.units.filter(u=>lids.includes(u.lid));
}
/* 세대에서 요일 하나만 뺀다. 남는 요일이 없으면 그 세대는 삭제. 삭제된 개수를 돌려줌 */
function dropDay(us,w){
  let gone=0;
  for(const u of us){
    const left=(u.days&&u.days.length?u.days:S.set.days).filter(d=>d!==w);
    if(left.length)u.days=left;
    else{S.units=S.units.filter(x=>x.id!==u.id);gone++}
  }
  return gone;
}
/* 세대 한 줄의 품목 요약. 요일을 골랐으면 그날 실제로 나가는 것만 */
function itemsLine(u){
  let its=u.items||[];
  if(MST.day!=null)its=its.filter(i=>(!i.d||!i.d.length||i.d.includes(MST.day))&&qtyOf(i,MST.day)>0);
  return its.length?its.map(itLabel).join(' · '):'품목 없음';
}
function ordBtns(t,id,i,n){
  return `<button data-act="mv" data-t="${t}" data-id="${id}" data-d="-1" ${i===0?'style="opacity:.25"':''}>▲</button>
          <button data-act="mv" data-t="${t}" data-id="${id}" data-d="1" ${i===n-1?'style="opacity:.25"':''}>▼</button>`;
}

let PQ='';                                   // 품목 검색어
const makers=()=>[...new Set(S.products.map(p=>(p.maker||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));
/* 색은 제조사별로 맞춘다 — 같은 회사 우유끼리 같은 색, 제조사 안 적은 건 회색 */
const MAKERPAL=['#4da3ff','#2ecc8f','#f5b445','#ff6b6b','#b57bff','#00c2d1','#ff8a3d','#7ee081','#e05fa0','#5b8def','#d4b106','#39c5bb'];
const NOMAKER='#7b8794';
function mColor(p){
  const m=(p&&p.maker||'').trim();
  if(!m)return NOMAKER;
  const i=makers().indexOf(m);
  return i<0?NOMAKER:MAKERPAL[i%MAKERPAL.length];
}

const pCard=p=>`<button class="pc" data-act="ped" data-id="${p.id}">

function prodList(){
  const q=norm(PQ),mode=S.set.psort||'name';
  let ps=S.products.slice();
  if(q)ps=ps.filter(p=>norm(p.name).includes(q)||norm(p.maker||'').includes(q));
  const byName=(a,b)=>a.name.localeCompare(b.name,'ko');
  if(!ps.length)return `<div class="card"><div class="empty">${q
    ?`'${esc(PQ)}' 로 찾은 품목이 없어요.`
    :'품목이 없어요.<br><span class="small">명단을 입력하면 품목이 자동으로 만들어져요.<br>여기서 사진만 붙여주면 끝!</span>'}</div></div>`
    +`<button class="btn pri full mt2" data-act="ped">＋ 품목 직접 추가</button>`;

  let grid;
  if(mode==='maker'){
    const g={};
    ps.forEach(p=>{const k=(p.maker||'').trim()||'제조사 미입력';(g[k]=g[k]||[]).push(p)});
    grid=Object.keys(g).sort((a,b)=>a==='제조사 미입력'?1:b==='제조사 미입력'?-1:a.localeCompare(b,'ko'))
      .map(k=>`<div class="chead"><span class="n">🏭 ${esc(k)}</span><span class="c">${g[k].length}개</span></div>
        <div class="pgrid">${g[k].sort(byName).map(pCard).join('')}</div>`).join('');
  }else{
    grid=`<div class="pgrid">${ps.sort(byName).map(pCard).join('')}</div>`;
  }
  const noPic=ps.filter(p=>!PIC[p.id]).length;
  return grid
    +`<button class="btn pri full mt2" data-act="ped">＋ 품목 직접 추가</button>`
    +(()=>{                                    // 알릴 게 없으면 줄 자체를 안 그린다
       const bits=[];
       if(q)bits.push(`${ps.length}개 찾음`);
       if(noPic)bits.push(`사진 없는 품목 ${noPic}개`);
       return bits.length?`<p class="tiny muted center mt">${bits.join(' · ')}</p>`:'';
     })();
}

function sheet(html){
  $('#modal').innerHTML=`<div class="ov" data-act="close"><div class="sheet" data-stop="1"><div class="grab"></div>${html}</div></div>`;
  document.body.style.overflow='hidden';

function closeM(){$('#modal').innerHTML='';document.body.style.overflow=''}
function toast(t){
  const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);
  setTimeout(()=>e.remove(),1900);
}
const val=id=>{const e=document.getElementById(id);return e?e.value.trim():''};

/* ---------- 품목 선택 행 (세대 편집용) ---------- */
let EDIT_ITEMS=[];
/* 수량도 요일마다 따로 정할 수 있다.
   요일 필터가 켜져 있으면 그 요일 수량(it.dq[요일])만, '전체'면 모든 요일 공통 수량(it.qty)을 고친다. */
const editQty=it=>MST.day==null?(it.qty||0)
  :((it.dq&&it.dq[MST.day]!=null)?it.dq[MST.day]:(it.qty||0));
function setEditQty(it,v){
  if(MST.day==null){it.qty=v;return}
  it.dq=it.dq||{};it.dq[MST.day]=v;
}
const anyQty=i=>(i.qty>0)||(i.dq&&Object.keys(i.dq).some(k=>i.dq[k]>0));
/* 새 품목 한 줄. 요일을 골라놨으면 그 요일에만 1개 (다른 요일 0) */
function newItem(pid){
  const it={pid,qty:0};
  setEditQty(it,1);
  return it;
}
/* 같은 품목이 두 줄로 생기지 않게 합친다.
   (요일에서 ✕ 로 뺐던 품목을 다시 추가하면 원래 줄이 되살아나야 함) */
function mergeDupes(i){
  const it=EDIT_ITEMS[i];if(!it)return;
  const dup=EDIT_ITEMS.findIndex((x,k)=>k!==i&&x.pid===it.pid);
  if(dup<0)return;
  setEditQty(EDIT_ITEMS[dup],Math.max(editQty(EDIT_ITEMS[dup]),editQty(it)||1));
  EDIT_ITEMS.splice(i,1);
}

function itemRows(){
  const box=document.getElementById('irows');if(!box)return;
  const opts=S.products.slice().sort((a,b)=>a.name.localeCompare(b.name,'ko'));
  /* 요일을 골랐으면 그날 안 나가는(0개) 품목 줄은 숨긴다 — ✕ 를 누르면 줄이 바로 사라지도록 */
  const rows=EDIT_ITEMS.map((it,i)=>({it,i})).filter(r=>MST.day==null||editQty(r.it)>0);
  box.innerHTML=rows.map(({it,i},k)=>{
    const own=MST.day!=null&&it.dq&&it.dq[MST.day]!=null;   // 이 요일만 따로 정해둔 값
    const other=it.dq?Object.keys(it.dq).filter(x=>+x!==MST.day).map(x=>DOW[x]+it.dq[x]).join(' '):'';
    const note=own
      ?`${it.qty>0?`기본 ${it.qty}개`:`<b style="color:var(--ac)">${DOW[MST.day]}요일에만</b>`}${other?` · 다른 요일 ${esc(other)}`:''}`
      :(other?`다른 요일에 따로: ${esc(other)}`:'');
    return `<div class="irow">
      <div class="row">
        <select data-act="ichg" data-i="${i}" class="grow">
          ${opts.map(p=>`<option value="${p.id}" ${p.id===it.pid?'selected':''}>${esc(p.name)}</option>`).join('')}
          <option value="__new">＋ 새 품목 만들기…</option>
        </select>
        <div class="stp"><button data-act="iq" data-i="${i}" data-d="-1">−</button>
        <span class="v" ${own?'style="color:var(--ac)"':''}>${editQty(it)}</span>
        <button data-act="iq" data-i="${i}" data-d="1">＋</button></div>
        <button class="btn xs dn" data-act="idel" data-i="${i}">✕</button>
      </div>
      <div class="row" style="margin-top:5px;gap:6px">
        ${rows.length>1?`<button class="btn xs" data-act="imv" data-i="${i}" data-d="-1" ${k===0?'style="opacity:.25"':''}>▲</button>
        <button class="btn xs" data-act="imv" data-i="${i}" data-d="1" ${k===rows.length-1?'style="opacity:.25"':''}>▼</button>`:''}
        <span class="tiny muted grow">${note}</span>
        ${own&&it.qty>0?`<button class="btn xs" data-act="iqreset" data-i="${i}">↺ 기본값으로</button>`:''}
      </div></div>`;
  }).join('')||`<p class="small muted mt">${MST.day==null
    ?'품목이 없어요. 아래에서 추가하세요.'
    :`${DOW[MST.day]}요일에 나가는 품목이 없어요.`}</p>`;
}

const A={
  tab(e){VIEW=e.dataset.v;if(VIEW==='manage')MST={cid:null,bid:null,lid:null,day:MST.day};if(VIEW!=='prod')PQ='';render();window.scrollTo(0,0)},

  dmove(e){const d=parseD(DATE);d.setDate(d.getDate()+ +e.dataset.n);DATE=dkey(d);render()},
  dtoday(){DATE=dkey(new Date());render()},

  /* --- 오늘 배달 --- */
  utog(e){const d=day(),id=e.dataset.id;d.done[id]?delete d.done[id]:d.done[id]=1;save();render()},
  ldone(e){
    const d=day(),l=e.dataset.id,pl=plan();
    pl.forEach(c=>c.lines.forEach(L=>{if(L.line.id===l)L.units.forEach(u=>{if(!d.skip[u.id])d.done[u.id]=1})}));
    save();render();toast('라인 완료!');
  },
  ltog(e){

  /* --- 오늘만 조정 --- */
  uedit(e){
    const id=e.dataset.id,d=day();
    /* 오늘만 추가한 집은 d.extra 에 있다. plan() 이 붙여주는 temp 표시는 사본에만 있어서
       여기서는 어디서 찾았는지로 직접 판단해야 한다 (이게 없어서 삭제 버튼이 안 떴음) */
    let u=S.units.find(x=>x.id===id),isTemp=false;
    if(!u){u=d.extra.find(x=>x.id===id);isTemp=!!u}
    if(!u)return;
    const base=new Map((u.items||[]).map(i=>[i.pid,qtyOf(i,dow())]));   // 요일별 수량 반영
    // 0으로 줄인 품목도 다시 올릴 수 있게 고정품목 + 조정품목 전부 표시
    const ids=new Set([...base.keys(),...Object.keys(d.adj[u.id]||{})]);
    const cur=new Map(eff(u,d).map(i=>[i.pid,i.qty]));
    const its=[...ids].map(pid=>({pid,qty:cur.get(pid)||0,adj:!!((d.adj[u.id]||{})[pid])}));
    sheet(`<h3 class="sh">${esc(u.name)} · 오늘만 조정</h3>
      <p class="tiny muted" style="margin:-8px 0 12px">여기서 바꾼 건 <b>${DATE}</b> 하루만 적용돼요. 고정 명단은 그대로예요.</p>
      <div id="adjrows">${its.map(i=>`<div class="adjit">
        <div class="row">
          <span class="grow"><span class="b">${esc(pname(i.pid))}</span>
            <span class="tiny muted" style="display:block;font-weight:400">고정 ${base.get(i.pid)||0}개${i.adj?' · <b style="color:var(--wn)">오늘 바뀜</b>':''}</span></span>
          <div class="stp"><button data-act="aq" data-u="${u.id}" data-p="${i.pid}" data-d="-1">−</button>
          <span class="v">${i.qty}</span><button data-act="aq" data-u="${u.id}" data-p="${i.pid}" data-d="1">＋</button></div>
        </div>
        ${i.qty>0?`<button class="btn xs mt" data-act="apick" data-u="${u.id}" data-p="${i.pid}">↔ 다른 품목으로 교체</button>`:''}
      </div>`).join('')}</div>
      <button class="btn full mt" data-act="apick" data-u="${u.id}">＋ 오늘만 품목 추가</button>
      <div class="sep mt2"></div>
      <button class="btn full mt2 ${d.skip[u.id]?'pri':'dn'}" data-act="askip" data-u="${u.id}">${d.skip[u.id]?'↩ 오늘 쉼 취소':'🚫 이 집 오늘 쉼'}</button>
      ${isTemp?`<button class="btn dn full mt" data-act="atemp" data-u="${u.id}">🗑 오늘 추가한 이 집 삭제</button>`:''}
      <button class="btn full mt" data-act="areset" data-u="${u.id}">조정 되돌리기</button>
      <button class="btn pri full mt2" data-act="close">닫기</button>`);
  },
  aq(e){
    const d=day(),un=e.dataset.u,p=e.dataset.p,n=+e.dataset.d;
    const u=S.units.find(x=>x.id===un)||d.extra.find(x=>x.id===un);if(!u)return;
    const b=(u.items||[]).filter(i=>i.pid===p).reduce((a,i)=>a+qtyOf(i,dow()),0);
    d.adj[un]=d.adj[un]||{};
    const nx=(d.adj[un][p]||0)+n;
    if(b+nx<0)return;                       // 총 수량은 0 미만으로 못 내려감
    d.adj[un][p]=nx;
    if(nx===0)delete d.adj[un][p];
    if(!Object.keys(d.adj[un]).length)delete d.adj[un];
    save();render();A.uedit({dataset:{id:un}});
  },
  /* 품목 고르기. data-p 가 있으면 그 품목을 '교체' 하는 것.

  apick(e){

      +(raw&&!ps.some(p=>norm(p.name)===q)

  mgo(e){MST={cid:e.dataset.c||null,bid:e.dataset.b||null,lid:e.dataset.l||null,day:MST.day};render();window.scrollTo(0,0)},

  mv(e){

    OW=MST.day;                                     // 지금 보고 있는 요일 기준으로 집는다
    const arr={c:visCourses(),b:visBlocks(MST.cid),l:visLines(MST.bid),u:mFilter(unitsOf(MST.lid))}[t];
    const i=arr.findIndex(x=>x.id===id),j=i+d;
    if(i<0||j<0||j>=arr.length)return;
    [arr[i],arr[j]]=[arr[j],arr[i]];

      arr.forEach((x,k)=>x.sort=k);                 // 전체 = 모든 요일 공통 기본 순서
    }else{
      S.order=S.order||{};
      const m=S.order[MST.day]=S.order[MST.day]||{};
      arr.forEach((x,k)=>m[x.id]=k);                // 이 요일에만 저장
    }
    save();render();
  },

      S.units.push({id:uid(),lid:MST.lid,name:fix(s),days,items:items.map(i=>({...i})),memo,who,code,sort:S.units.filter(u=>u.lid===MST.lid).length}));

  /* 요일을 골라놨으면 그 요일에만 들어가는 품목으로 추가한다 (기본 수량은 0) */
  iadd(){
    if(!S.products.length){A.pnew();return}
    /* 이 요일에 이미 나가는 품목은 건너뛰고 고른다.
       ✕ 로 뺐던(숨어 있는) 품목이면 그 줄을 되살린다 */
    const showing=new Set(EDIT_ITEMS.filter(x=>MST.day==null||editQty(x)>0).map(x=>x.pid));
    const p=S.products.find(x=>!showing.has(x.id))||S.products[0];
    const i=EDIT_ITEMS.findIndex(x=>x.pid===p.id);
    if(i>=0)setEditQty(EDIT_ITEMS[i],Math.max(1,editQty(EDIT_ITEMS[i])));
    else EDIT_ITEMS.push(newItem(p.id));
    itemRows();

  ichg(e){
    const i=+e.dataset.i;

    EDIT_ITEMS[i].pid=e.value;
    mergeDupes(i);
    itemRows();

  iq(e){const it=EDIT_ITEMS[+e.dataset.i];setEditQty(it,Math.max(0,editQty(it)+ +e.dataset.d));itemRows()},
  iqreset(e){const it=EDIT_ITEMS[+e.dataset.i];if(it.dq){delete it.dq[MST.day];if(!Object.keys(it.dq).length)delete it.dq}itemRows()},
  /* 품목 순서 바꾸기 — 배달 화면에 이 순서대로 나온다 (화면에 보이는 줄 기준으로 이동) */
  imv(e){
    const i=+e.dataset.i,d=+e.dataset.d;
    const vis=EDIT_ITEMS.map((it,k)=>k).filter(k=>MST.day==null||editQty(EDIT_ITEMS[k])>0);
    const p=vis.indexOf(i),q=p+d;
    if(p<0||q<0||q>=vis.length)return;
    const a=vis[p],b=vis[q];
    [EDIT_ITEMS[a],EDIT_ITEMS[b]]=[EDIT_ITEMS[b],EDIT_ITEMS[a]];
    itemRows();
  },
  /* 요일을 골라놨으면 '이 요일만 0' 으로. 다른 요일에도 없으면 아예 뺀다 */
  idel(e){
    const i=+e.dataset.i,it=EDIT_ITEMS[i];
    if(MST.day==null)EDIT_ITEMS.splice(i,1);
    else{setEditQty(it,0);if(!anyQty(it))EDIT_ITEMS.splice(i,1)}
    itemRows();
  },
  pnew(idx){
    const n=prompt('새 우유 품목 이름');
    if(!n||!n.trim()){itemRows();return}
    const p={id:uid(),name:n.trim(),color:hue(n)};S.products.push(p);save();
    if(typeof idx==='number'&&EDIT_ITEMS[idx])EDIT_ITEMS[idx].pid=p.id;else EDIT_ITEMS.push(newItem(p.id));
    itemRows();
  },
  del(e){
    const t=e.dataset.t,id=e.dataset.id;
    const names={c:'코스',b:'동',l:'라인',u:'세대'};

    const all=unitsUnder(t,id);
    /* 안이 텅 빈 코스·동·라인은 어느 요일에도 영향이 없으니 요일 상관없이 바로 삭제 */
    if(t!=='u'&&!all.length){
      if(!confirm(`비어 있는 이 ${names[t]}을(를) 삭제할까요?\n\n안에 세대가 하나도 없어서\n다른 요일에도 영향이 없어요.`))return;
    }
    /* 요일을 골라놨으면 '삭제' 가 아니라 '그 요일에서만 빼기' 로 동작한다 */
    else if(MST.day!=null){
      const w=MST.day;
      const hit=all.filter(u=>onDay(u,w));
      if(!hit.length)return toast(`${DOW[w]}요일에 배달하는 집이 없어요`);
      const what=t==='u'?'이 세대를':`이 ${names[t]} 안의 ${hit.length}곳을`;
      if(!confirm(`${DOW[w]}요일 배달에서 ${what} 뺄까요?\n\n다른 요일 배달은 그대로 남습니다.`))return;
      const gone=dropDay(hit,w);
      save();closeM();render();
      toast(gone?`${DOW[w]}요일에서 뺐어요 · ${gone}곳 삭제`:`${DOW[w]}요일에서 뺐어요`);
      return;
    }

    else if(!confirm(`이 ${names[t]}을(를) 완전히 삭제할까요?\n모든 요일에서 사라집니다.${t!=='u'?'\n안에 있는 내용도 전부 지워져요.':''}`))return;
    if(t==='c'){
      const bs=S.blocks.filter(b=>b.cid===id).map(b=>b.id);
      const ls=S.lines.filter(l=>bs.includes(l.bid)).map(l=>l.id);
      S.units=S.units.filter(u=>!ls.includes(u.lid));S.lines=S.lines.filter(l=>!bs.includes(l.bid));
      S.blocks=S.blocks.filter(b=>b.cid!==id);S.courses=S.courses.filter(c=>c.id!==id);MST={cid:null,bid:null,lid:null,day:MST.day};
    }else if(t==='b'){
      const ls=S.lines.filter(l=>l.bid===id).map(l=>l.id);
      S.units=S.units.filter(u=>!ls.includes(u.lid));S.lines=S.lines.filter(l=>l.bid!==id);
      S.blocks=S.blocks.filter(b=>b.id!==id);MST.bid=null;MST.lid=null;
    }else if(t==='l'){
      S.units=S.units.filter(u=>u.lid!==id);S.lines=S.lines.filter(l=>l.id!==id);MST.lid=null;
    }else S.units=S.units.filter(u=>u.id!==id);
    save();closeM();render();
  },
  autosort(e){
    OW=null;
    const us=unitsOf(e.dataset.l);
    const num=s=>{const m=String(s).match(/\d+/);return m?+m[0]:0};
    us.sort((a,b)=>S.set.floorDesc?num(b.name)-num(a.name):num(a.name)-num(b.name));
    us.forEach((u,i)=>u.sort=i);
    clearOrder(us.map(u=>u.id));        // 요일별로 따로 잡아둔 순서는 지우고 층순을 따르게
    save();render();toast('층순으로 정렬했어요');
  },

  /* 타이핑하는 동안 몇 줄이 제대로 인식되는지 바로 보여준다 */
  bulklive(el){

    let r;try{r=parseBulk(t)}catch(e){box.innerHTML='';return}
    const n=r.courses.reduce((a,c)=>a+c.blocks.reduce((x,b)=>x+b.units.length,0),0);
    const bad=r.warn.length,emp=(r.empty||[]).length;
    box.innerHTML=`<div class="row wrap" style="gap:6px">
        <span class="pill ${n?'ok':'dn'}">세대 ${n}곳</span>
        ${r.newProducts.length?`<span class="pill">새 품목 ${r.newProducts.length}</span>`:''}
        ${bad?`<span class="pill dn">못 읽은 줄 ${bad}</span>`:''}
      </div>
      ${bad?`<div class="tiny" style="color:var(--dn);margin-top:5px">⚠ 못 읽음 — ${r.warn.slice(-2).map(esc).join(' / ')}</div>`:''}
      ${emp?`<div class="tiny" style="color:var(--wn);margin-top:4px">· ${r.empty.map(esc).join(', ')} 아래에 아직 세대가 없어요</div>`:''}`;

/* 고른 품목을 오늘 조정에 반영하고 조정 화면으로 돌아간다.
   교체(k.swap)면 원래 수량만큼 그대로 옮기고, 그냥 추가면 1개 넣는다. */
function addPick(pid){
  const k=window.__pick;if(!k||!pid)return;
  const d=day();
  const u=S.units.find(x=>x.id===k.u)||d.extra.find(x=>x.id===k.u);
  d.adj[k.u]=d.adj[k.u]||{};
  const A2=d.adj[k.u];
  if(k.swap&&k.swap!==pid&&u){
    const now=(eff(u,d).find(i=>i.pid===k.swap)||{}).qty||0;
    if(now){
      A2[k.swap]=(A2[k.swap]||0)-now;
      if(A2[k.swap]===0)delete A2[k.swap];
    }
    A2[pid]=(A2[pid]||0)+(now||1);
  }else{
    A2[pid]=(A2[pid]||0)+1;
  }
  if(!Object.keys(A2).length)delete d.adj[k.u];
  window.__pick=null;
  save();render();A.uedit({dataset:{id:k.u}});
}

function hue(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return `hsl(${h} 70% 55%)`}
/* onerror 가 없으면 실패했을 때 영원히 안 끝나서 앱이 멈춘다 */
function blob2b64(b){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result);
    r.onerror=()=>rej(new Error('사진을 읽지 못했어요'));

}
function b642blob(d){const[m,b]=d.split(',');const t=m.match(/:(.*?);/)[1];const bin=atob(b);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new Blob([u],{type:t})}

/* =========================================================
   명단 파서 — 실제 배달명단(일일/합산) 텍스트를 그대로 읽음
   ---------------------------------------------------------
   지원하는 두 가지 형식
   A. 일일배달명단 : 순번 / 주소(단지 동-호수) .이름 님 / 품명 / 수량 / 요일
   B. 합산배달명단 : (단지 NNN 동) 그룹 + 호수 / 품명 / 수량 / 요일 / 비고
   같은 단지가 여러 명단에 나오면 [코드] 뒤의 이름을 기준으로 한 코스에 합침
   ========================================================= */
const norm=s=>String(s).toLowerCase().replace(/\s+/g,'');
const clip=s=>s.length>24?s.slice(0,24)+'…':s;

/* 호수 → 라인 번호(끝 두 자리) → 라인 묶음 이름 */
function hoLine(ho){const n=parseInt(String(ho).replace(/\D/g,''),10);return n?(n%100||100):0}
/* 라인은 항상 2개씩 묶는다 — 1·2호 라인이 한 건물(공동현관 하나) */
function lineName(ln){
  if(!ln)return '기타';
  const k=Math.ceil(ln/2);
  return (k*2-1)+'-'+(k*2)+'라인';
}
/* 괄호 안 내용을 [현관 비밀번호, 메모] 로 나눈다
   - '#' 이 있으면 그 부분만 비번  (#1501 8587 / #501#1006 / #*4875#)
   - '#' 이 없으면 3자리 이상 숫자가 든 조각을 통째로 비번  (1304열쇠2103종, 열쇠 경비 9658 열)
   - 숫자가 없으면 전부 메모 */
function splitCode(s){
  s=String(s||'').replace(/\s+/g,' ').trim();
  if(!s)return ['',''];
  /* 규칙은 단순하게 — 괄호 안 전체가 비밀번호.
     메모를 따로 남기고 싶으면 콤마로 구분한다.
       (1603#1004 벨)              → 🔑 1603#1004 벨
       (1603#1004 벨, 7시까지)     → 🔑 1603#1004 벨   📝 7시까지
       (문 앞에 두세요)            → 숫자가 없으면 전부 메모 */
  const segs=s.split(/\s*[,，]\s*/).map(x=>x.trim()).filter(Boolean);
  const code=segs.shift()||'';
  const memo=segs.join(', ');
  if(!/\d/.test(code))return ['',[code,memo].filter(Boolean).join(', ')];
  return [code,memo];
}
/* (월4금3) → {1:4,5:3} */
function parseDq(s){
  const c=String(s).replace(/\s/g,'');
  if(!/^(?:[월화수목금토일]\d+){2,}$/.test(c))return null;
  const o={};
  for(const m of c.matchAll(/([월화수목금토일])(\d+)/g))o[DOW.indexOf(m[1])]=+m[2];
  return o;
}

function parseBulk(txt){
  const out={courses:[],newProducts:[],warn:[],empty:[],sheets:[],dow:null};
  const known=new Set(S.products.map(p=>norm(p.name)));
  const seen=new Set();
  let C=null,B=null,U=null,sheet='',curDanji='';
  /* explicit = 코스를 [이름] 이나 단독 줄로 "직접" 정했는가.
     직접 정했으면 그 코스에 계속 담고, 아니면 줄마다 나오는 아파트 이름으로 코스를 나눈다 */
  let explicit=false;

  const cGet=n=>{let c=out.courses.find(x=>norm(x.name)===norm(n));if(!c){c={name:n,blocks:[]};out.courses.push(c)}return c};
  /* 동은 "단지명|동번호" 로 구분해서 담는다. 서로 다른 아파트의 같은 동 번호가 섞이지 않게 */
  const bGet=(c,dg,dj)=>{
    const k=norm(dj||'')+'|'+dg;
    let b=c.blocks.find(x=>x.key===k);
    if(!b){b={key:k,dong:dg,danji:dj||'',name:dg==='기타'?'기타':dg+'동',units:[]};c.blocks.push(b)}
    return b;
  };
  /* "연세무항750 1 연세무항170 3" → 품목 두 개로 나눈다.
     숫자만 있는 낱말이 수량. 750·900 같은 용량과 헷갈리지 않게 50 이하만 수량으로 본다
     (개·팩·병이 붙어 있으면 크기와 상관없이 수량). */
  const splitItems=text=>{
    const toks=String(text||'').trim().split(/\s+/).filter(Boolean);
    const list=[];let buf=[];
    const push=(n,q)=>{n=n.replace(/^[.,·]+|[.,·]+$/g,'').trim();if(n)list.push({name:n,qty:q})};
    toks.forEach((tk,i)=>{
      const m=tk.match(/^(\d+)\s*(개|팩|병)?$/);
      /* 맨 끝 낱말은 크기와 상관없이 수량 (60개 같은 큰 수량도 인식) */
      if(m&&buf.length&&(m[2]||i===toks.length-1||+m[1]<=50)){push(buf.join(' '),+m[1]);buf=[]}
      else buf.push(tk);
    });
    if(buf.length)push(buf.join(' '),1);      // 수량을 안 적었으면 1개
    return list;
  };
  const addItem=(u,name,qty,days)=>{
    name=String(name).replace(/\s+/g,' ').replace(/^[.,·]+|[.,·]+$/g,'').trim();
    if(!name||!qty)return;
    const k=norm(name);
    if(!known.has(k)&&!seen.has(k)){seen.add(k);out.newProducts.push(name)}
    u.items.push({name,qty,days:days&&days.length?days:null});
  };

  for(const raw of txt.split(/\r?\n/)){
    let t=raw.replace(/[ \t]/g,' ').replace(/\s+/g,' ').trim();
    if(!t||t.startsWith('//'))continue;
    /* 명단에 적힌 날짜의 요일을 기억해 둔다 — 2026.08.21(금) */
    if(out.dow==null){
      const dm=t.match(/\d{4}\.\d{1,2}\.\d{1,2}\s*[\[(]\s*([월화수목금토일])\s*[\])]/);
      if(dm)out.dow=DOW.indexOf(dm[1]);
    }
    /* --- 머리글·꼬리말·합계표 버리기 --- */
    if(!t.startsWith('[')&&/배달명단|Page\s*[:：]/.test(t))continue;   // [코드] 줄에도 Page가 붙어 오므로 제외
    if(/^(순번|호수|품명)[\s(]/.test(t))continue;                      // 한글엔 \b 가 안 먹음
    if(/(대리점|보급소|영업소)$/.test(t))continue;
    if(/^\d+곳$/.test(t))continue;
    if(/합계/.test(t))continue;
    if(/^[\d\s|.,\-–—=_]+$/.test(t))continue;
    if(/^(?:\d{2}\.\d{2}\s*[\[(][월화수목금토일][\])]\s*)+$/.test(t))continue;

    let m;
    /* --- 명단 헤더  [2311]서천현대  2026.08.21(금) --- */
    if((m=t.match(/^\[(\d{3,5})\]\s*(.*)$/))){
      sheet=m[1];
      const nm=m[2]
        .replace(/\d{4}\.\d{2}\.\d{2}.*$/,'')
        .replace(/\(\s*주\s*\d*\s*\)/g,'')
        .replace(/\(\s*달\s*\)/g,'')
        .replace(/[ㄱ-ㅎㅏ-ㅣ]+\s*\d*\s*종?\s*$/,'')
        .trim();
      if(nm){C=cGet(nm);explicit=true;curDanji='';B=null;U=null;out.sheets.push('['+m[1]+'] '+nm)}
      continue;
    }
    /* --- 직접 쓴 코스  [행복마을] --- */
    if((m=t.match(/^\[\s*([^\]\d][^\]]*)\]$/))){C=cGet(m[1].trim());explicit=true;curDanji='';B=null;U=null;continue}

    /* --- 동 그룹 헤더  (예현현대 101 동) --- */
    if((m=t.match(/^[（(]\s*(.*?)\s*(\d{1,4})\s*동\s*[)）]$/))){
      const dj=m[1].replace(/[@#*·]+$/,'').trim();
      if(dj&&!explicit)C=cGet(dj);
      else if(!C)C=cGet(dj||('명단 '+(sheet||'1')));
      curDanji=dj;B=bGet(C,m[2],dj);U=null;continue;
    }

    /* --- 괄호로 시작하는 줄 = 앞 세대의 비번 / 메모 / 요일별 수량 --- */
    if(/^[（(]/.test(t)){
      if(!U){out.warn.push(clip(t));continue}
      let s=t;
      const dm=s.match(/[（(]\s*((?:[월화수목금토일]\s*\d+\s*){2,})[)）]/);
      if(dm){const dq=parseDq(dm[1]);if(dq&&U.items.length)U.items[U.items.length-1].dq=dq;s=s.replace(dm[0],' ')}
      s=s.trim().replace(/^[（(]\s*/,'').replace(/\s*[)）]\s*$/,'').trim();
      if(s){
        const [c,mm]=splitCode(s);
        if(c&&!U.code)U.code=c;
        if(mm&&!(U.memo||"").includes(mm))U.memo=(U.memo?U.memo+' ':'')+mm;
      }
      continue;
    }

    /* --- 데이터 줄 --- */
    /* 줄 맨 끝의 (…) 는 메모로 떼어둔다 — "… 연세A2750 1 (7시까지꼭투입)"
       (월4금3) 처럼 요일별 수량이면 메모가 아니라 수량으로 */
    let tailMemo='',tailDq=null;
    const tm=t.match(/[（(]([^)）]*)[)）]\s*$/);
    if(tm&&tm.index>0){
      const inner=tm[1].trim();
      const d0=parseDq(inner);
      if(d0)tailDq=d0; else tailMemo=inner;
      t=t.slice(0,tm.index).trim();
    }
    /* 기준점: "수량 + 요일". 요일이 안 적힌 명단이면 줄 끝의 수량을 기준으로 */
    let an=t.match(/(\d+)\s*[.,]?\s+([월화수목금토일]{1,7})(?=\s|$)/);
    let qty,days=null,head,tail='';
    if(an){
      qty=+an[1];
      days=[...an[2]].map(ch=>DOW.indexOf(ch)).filter(x=>x>=0);
      /* 수량을 품목 영역에 되돌려 붙인다 — 한 줄에 품목이 여러 개일 수 있어서 */
      head=(t.slice(0,an.index)+' '+an[1]).trim();
      tail=t.slice(an.index+an[0].length).trim();
    }else{
      an=t.match(/(?:^|\s)(\d+)\s*(?:개|팩|병)?\s*$/);
      if(!an){
        /* 숫자가 하나도 없는 짧은 줄 = 아파트(코스) 이름으로 본다.  예: 망포e편한 */
        if(!/\d/.test(t)&&t.length<=25&&!/님/.test(t)){C=cGet(t);explicit=true;curDanji='';B=null;U=null;continue}
        out.warn.push(clip(t));continue;
      }
      qty=+an[1];
      head=(t.slice(0,an.index)+' '+an[1]).trim();
    }

    let dong='',ho='',who='',note='',prod='',danji='';
    const am=head.match(/(\d{1,4})\s*-\s*(\d{1,5})(?!\d)/);
    if(am){
      /* 형식 A : 주소에 "동-호수" 가 들어있음 */
      dong=am[1];ho=am[2];
      danji=head.slice(0,am.index).trim().replace(/^\d+\s+/,'');     // 앞의 순번 떼기
      let post=head.slice(am.index+am[0].length).trim();
      const pm=post.match(/[（(]([^)）]*)[)）]/);                      // 인라인 (비번)
      if(pm){note=pm[1].trim();post=(post.slice(0,pm.index)+' '+post.slice(pm.index+pm[0].length)).replace(/\s+/g,' ').trim()}
      /* 이름: ".이름 님" → "이름 님" → 첫 낱말이 순수 한글 2~4자면 이름으로 */
      const nm=post.match(/[.·]\s*([가-힣]{2,4})\s*(?:님)?(?=\s|$)/)||post.match(/([가-힣]{2,4})\s*님(?=\s|$)/);
      if(nm){
        who=nm[1];
        const pre=post.slice(0,nm.index).replace(/[.·]\s*$/,'').trim();
        if(pre)note=(note?note+' ':'')+pre;                          // 7/8월얼음 같은 건 메모로
        post=post.slice(nm.index+nm[0].length).trim();
      }else{
        const tk=post.split(' ').filter(Boolean);
        if(tk.length>=2&&/^[가-힣]{2,4}$/.test(tk[0])){who=tk[0];post=tk.slice(1).join(' ')}
      }
      prod=post;
    }else{
      /* 형식 B : head = 호수 + 품명,  tail(비고) = 동-호수 이름 님 */
      const h=head.match(/^(\d{1,5})\s+(.*)$/);
      if(h){ho=h[1];prod=h[2].trim()}else prod=head;
      const bm=tail.match(/(\d{1,4})\s*-\s*(\d{1,5})(?!\d)/);
      if(bm){dong=bm[1];if(!ho)ho=bm[2]}
      const wm=tail.match(/([가-힣]{2,4})\s*님/);
      if(wm)who=wm[1];
      const pm=tail.match(/[（(]([^)）]*)[)）]/);
      if(pm&&!/^\s*(?:VIP|vip)\s*$/.test(pm[1]))note=pm[1].trim();
    }

    /* 호수가 없으면 = 앞 세대에 품목 한 줄 더 붙는 경우 (예: 무료얼음) */
    if(!ho){
      if(U){splitItems(prod).forEach(it=>addItem(U,it.name,it.qty,days));continue}
      out.warn.push(clip(t));continue;
    }

    /* 코스를 직접 정하지 않았으면, 줄에 적힌 아파트 이름마다 코스를 따로 만든다 */
    if(danji&&!explicit)C=cGet(danji);
    else if(!C)C=cGet(danji||('명단 '+(sheet||'1')));
    if(danji)curDanji=danji;
    if(dong)B=bGet(C,dong,danji||curDanji);
    else if(!B)B=bGet(C,'기타','');

    U=B.units.find(x=>x.ho===ho);
    if(!U){U={ho,name:ho+'호',who:'',code:'',memo:'',items:[]};B.units.push(U)}
    if(who&&!U.who)U.who=who;
    if(note){
      const [c,mm]=splitCode(note);
      if(c&&!U.code)U.code=c;
      if(mm&&!(U.memo||"").includes(mm))U.memo=(U.memo?U.memo+' ':'')+mm;
    }
    if(tailMemo&&!(U.memo||'').includes(tailMemo))U.memo=(U.memo?U.memo+' ':'')+tailMemo;
    splitItems(prod).forEach(it=>addItem(U,it.name,it.qty,days));
    if(tailDq&&U.items.length)U.items[U.items.length-1].dq=tailDq;
  }

  /* 마무리 1: 같은 코스에 같은 동 번호가 서로 다른 단지로 들어왔으면 단지명을 붙여 구분 */
  for(const c of out.courses){
    const byDong={};
    c.blocks.forEach(b=>{(byDong[b.dong]=byDong[b.dong]||new Set()).add(b.danji||'')});
    c.blocks.forEach(b=>{
      if(b.dong==='기타')return;
      b.name=(byDong[b.dong].size>1&&b.danji?b.danji+' ':'')+b.dong+'동';
    });
  }
  /* 마무리 2: 세대 요일 = 품목 요일의 합집합, 다른 품목만 개별 요일 유지 */
  for(const c of out.courses)for(const b of c.blocks)for(const u of b.units){
    const all=[...new Set(u.items.flatMap(i=>i.days||[]))].sort();
    u.days=all;
    for(const i of u.items){
      if(i.days&&i.days.join()!==all.join())i.d=i.days;
      delete i.days;
    }
  }
  /* 세대가 하나도 안 붙은 아파트 이름 줄은 따로 알려준다 (오타로 생긴 줄일 수 있음) */
  out.empty=out.courses.filter(c=>!c.blocks.some(b=>b.units.length)).map(c=>c.name);
  out.courses=out.courses.filter(c=>c.blocks.some(b=>b.units.length));
  return out;
}

function applyBulk(r){
  const pmap=new Map(S.products.map(p=>[norm(p.name),p.id]));
  const getP=n=>{
    const k=norm(n);
    if(pmap.has(k))return pmap.get(k);
    const p={id:uid(),name:n,color:hue(n)};S.products.push(p);pmap.set(k,p.id);return p.id;
  };
  for(const c of r.courses){
    let C=S.courses.find(x=>norm(x.name)===norm(c.name));
    if(!C){C={id:uid(),name:c.name,sort:S.courses.length};S.courses.push(C)}
    for(const b of c.blocks){
      let B=S.blocks.find(x=>x.cid===C.id&&norm(x.name)===norm(b.name));
      if(!B){B={id:uid(),cid:C.id,name:b.name,sort:S.blocks.filter(x=>x.cid===C.id).length};S.blocks.push(B)}
      for(const u of b.units){
        const ln=lineName(hoLine(u.ho));
        let L=S.lines.find(x=>x.bid===B.id&&x.name===ln);
        if(!L){L={id:uid(),bid:B.id,name:ln,code:'',memo:'',sort:S.lines.filter(x=>x.bid===B.id).length};S.lines.push(L)}
        /* 같은 동 안에 이미 있으면(다른 라인에 옮겨놨더라도) 그 세대를 다시 씀 */
        const dongLines=S.lines.filter(x=>x.bid===B.id).map(x=>x.id);
        let U=S.units.find(x=>dongLines.includes(x.lid)&&norm(x.name)===norm(u.name));
        if(!U){
          U={id:uid(),lid:L.id,name:u.name,who:u.who||'',code:u.code||'',memo:u.memo||'',
             items:[],days:u.days||[],sort:S.units.filter(x=>x.lid===L.id).length};
          S.units.push(U);
        }else{
          if(u.who)U.who=u.who;
          if(u.code)U.code=u.code;
          if(u.memo&&!(U.memo||'').includes(u.memo))U.memo=(U.memo?U.memo+' / ':'')+u.memo;
          U.days=[...new Set([...(U.days||[]),...(u.days||[])])].sort((x,y)=>x-y);
          U.items=U.items||[];
        }
        /* 품목 병합: 같은 품목이면 수량 갱신, 없으면 추가 (다른 명단 것은 그대로 둠) */
        for(const it of u.items){
          const pid=getP(it.name);
          const ex=U.items.find(x=>x.pid===pid);
          if(ex){ex.qty=it.qty;it.dq?ex.dq=it.dq:delete ex.dq;it.d?ex.d=it.d:delete ex.d}
          else{const nu={pid,qty:it.qty};if(it.dq)nu.dq=it.dq;if(it.d)nu.d=it.d;U.items.push(nu)}
        }
      }
    }
  }
}

/* 호수 끝 두 자리로 라인을 다시 배정 */
function reassignLines(){
  for(const B of S.blocks){
    for(const u of S.units.filter(x=>S.lines.some(l=>l.id===x.lid&&l.bid===B.id))){
      const ln=lineName(hoLine(u.name));
      let L=S.lines.find(x=>x.bid===B.id&&x.name===ln);
      if(!L){L={id:uid(),bid:B.id,name:ln,code:'',memo:'',sort:S.lines.filter(x=>x.bid===B.id).length};S.lines.push(L)}
      u.lid=L.id;
    }
  }
  S.lines=S.lines.filter(l=>S.units.some(u=>u.lid===l.id));
  autoAll();
}

/* 규칙 기반 자동 동선 정렬: 코스순 → 동 번호 → 라인 번호 → 층(기본 내림차순)
   요일별로 따로 잡아둔 순서는 전부 지우고 기본 순서 하나로 되돌린다 */
function autoAll(){
  OW=null;S.order={};
  const n=s=>{const m=String(s).match(/\d+/);return m?+m[0]:9999};
  courses().forEach((c,i)=>c.sort=i);
  S.courses.forEach(c=>blocksOf(c.id).sort((a,b)=>n(a.name)-n(b.name)).forEach((b,i)=>b.sort=i));
  S.blocks.forEach(b=>linesOf(b.id).sort((a,b2)=>n(a.name)-n(b2.name)).forEach((l,i)=>l.sort=i));
  S.lines.forEach(l=>unitsOf(l.id).sort((a,b)=>S.set.floorDesc?n(b.name)-n(a.name):n(a.name)-n(b.name)).forEach((u,i)=>u.sort=i));
}

/* =========================================================
   이벤트
   ========================================================= */
document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]');
  if(!el)return;
  /* 입력 요소는 클릭을 가로채면 안 된다 — select 는 목록이 안 열리고, input 은 포커스가 안 잡힘 */
  if(el.tagName==='SELECT'||el.tagName==='TEXTAREA'||el.tagName==='INPUT')return;
  if(el.classList.contains('ov')&&ev.target!==el)return;
  const f=A[el.dataset.act];
  if(f){ev.preventDefault();f(el,ev)}
});
document.addEventListener('change',ev=>{
  const el=ev.target.closest('[data-act]');if(!el)return;
  if(el.tagName==='SELECT'||el.type==='file'){const f=A[el.dataset.act];if(f)f(el,ev)}
});
/* 검색창처럼 입력할 때마다 반응해야 하는 것 (data-act 를 쓰면 클릭이 가로채여 포커스가 안 잡힘) */
document.addEventListener('input',ev=>{
  const el=ev.target.closest('[data-oninput]');if(!el)return;
  const f=A[el.dataset.oninput];if(f)f(el,ev);
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeM()});

/* 부팅
   화면을 먼저 그린 뒤 사진을 읽는다. 사진 읽기가 어디선가 멈춰도 앱은 정상적으로 뜬다. */
(async()=>{
  const draw=()=>{
    try{render()}
    catch(e){
      $('#main').innerHTML=`<div class="card pad"><div class="b">화면을 그리지 못했어요</div>
        <p class="small muted">${esc(String(e&&e.message||e))}</p>
        <button class="btn full mt" onclick="location.reload()">새로고침</button>
        <button class="btn dn full mt" data-act="wipe">전체 삭제 후 다시 시작</button></div>`;
    }
  };
  draw();                                  // ① 먼저 오늘 배달 화면부터 띄우고
  try{await loadPics()}catch(e){}          // ② 사진은 뒤따라 읽어서
  draw();                                  // ③ 사진 붙여 다시 그림
  if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
